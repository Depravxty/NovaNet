<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NØVA</title>
  <style>
    body {
      width: 260px;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #c9c9c9;
      padding: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #E8E8E8;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #9A9A9A;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border-radius: 4px;
      border: 1px solid #6b5a1f;
      background: #1a1a1a;
      color: #E8E8E8;
      margin-bottom: 10px;
    }
    input:focus {
      outline: none;
      border-color: #D4AF37;
    }
    button {
      width: 100%;
      padding: 9px;
      border: 1px solid #D4AF37;
      border-radius: 4px;
      background: #1a1a1a;
      color: #D4AF37;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #D4AF37;
      color: #121212;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 14px;
      color: #9A9A9A;
    }
  </style>
</head>
<body>
  <h1>NØVA — Leetify API Key</h1>
  <label for="apiKey">Optional — raises your rate limit (leetify.com/app/developer)</label>
  <input id="apiKey" type="password" placeholder="Paste your API key" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
